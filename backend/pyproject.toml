[project]
name = "video-gen-backend"
version = "0.1.0"
description = "FastAPI backend for Higgsfield video generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "higgsfield-client==0.2.0",
    "httpx>=0.27",
    "cryptography>=43",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
